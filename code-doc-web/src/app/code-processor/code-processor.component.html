<div class="flex h-screen bg-background text-primaryText font-[JetBrains Mono,monospace]">
  <!-- Left Sidebar -->
  <aside class="w-64 bg-surface border-r border-border p-4 space-y-6 shadow-md">
    <div class="text-xl font-bold text-highlight">🧠 SmartCode AI</div>
    <nav class="space-y-3 mt-8">
      <a class="block hover:text-white transition" routerLink="/history">🕒 History</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    <!-- Top Navbar -->
    <div class="flex justify-end items-center p-4 border-b border-border bg-surface shadow-sm">
      <div class="relative">
        <div class="relative">
          <app-profile></app-profile>
        </div>
      </div>
    </div>

    <!-- Content Section -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 p-6 flex-1 overflow-auto">
      <!-- Input Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-6 bg-surface rounded-2xl p-6 shadow-lg border border-border">
        <div>
          <label class="block text-xs font-semibold text-secondaryText mb-1">Documentation File</label>
          <input type="file" id="documentationFile" (change)="onFileSelected($event)" required
            class="block w-full bg-input text-sm text-primaryText border border-border rounded-md p-2 focus:outline-none focus:ring focus:ring-highlight" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-secondaryText mb-1">API Key</label>
            <input type="text" id="apiKey" [(ngModel)]="apiKey" name="apiKey" required
              class="block w-full bg-input text-sm text-primaryText border border-border rounded-md p-2 focus:outline-none focus:ring-1 focus:ring-highlight" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-secondaryText mb-1">API Key Type</label>
            <select id="apiKeyType" [(ngModel)]="apiKeyType" name="apiKeyType"
              class="block w-full bg-input text-sm text-primaryText border border-border rounded-md p-2">
              <option value="OpenAI">OpenAI</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-secondaryText mb-1">Detail Level</label>
            <select id="detailLevel" [(ngModel)]="detailLevel" name="detailLevel"
              class="block w-full bg-input text-sm text-primaryText border border-border rounded-md p-2">
              <option value="Basic">Basic</option>
              <option value="Detailed">Detailed</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-secondaryText mb-1">Feature Type</label>
            <select id="featureType" [(ngModel)]="featureType" name="featureType"
              class="block w-full bg-input text-sm text-primaryText border border-border rounded-md p-2">
              <option value="Comments">Comments</option>
              <option value="Rename">Rename</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-secondaryText mb-1">Code Snippet</label>
          <textarea id="codeSnippet" [(ngModel)]="codeSnippet" name="codeSnippet" rows="10" required
            class="block w-full bg-code text-codeText font-mono text-sm border border-border rounded-md p-3 leading-relaxed resize-none shadow-inner"
            placeholder="// Paste your code here..."></textarea>
        </div>

        <button type="submit" [disabled]="loading"
          class="w-full bg-highlight text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 hover:shadow-md transition-all disabled:opacity-50">
          Submit
        </button>

        <div *ngIf="loading" class="text-center text-highlight font-medium">⏳ Processing...</div>
        <div *ngIf="error" class="text-center text-red-400 font-medium">{{ error }}</div>
      </form>

      <!-- Output Section -->
      <div class="flex flex-col space-y-4">
        <div class="bg-surface border border-border p-4 rounded-2xl shadow-md">
          <h3 class="text-sm font-bold text-highlight mb-3">🧾 Modified Code:</h3>
          <pre class="whitespace-pre-wrap text-sm text-codeText bg-code p-4 rounded-md overflow-auto leading-relaxed shadow-inner fade-in">
            {{ result }}
          </pre>

          <h3 class="text-sm font-bold text-highlight mb-3 mt-6">Explanation</h3>
          <pre class="whitespace-pre-wrap text-sm text-codeText bg-code p-4 rounded-md overflow-auto leading-relaxed shadow-inner fade-in">
            {{ result }}
          </pre>
        </div>
      </div>
    </div>
  </main>
</div>
