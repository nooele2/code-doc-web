<div class="flex h-screen bg-[#202225] text-gray-200 font-[JetBrains Mono,monospace]">
  <!-- Left Sidebar -->
  <aside class="w-64 bg-[#252526] border-r border-[#3a3a3a] p-4 space-y-6 shadow-md">
    <div class="text-xl font-bold text-blue-400">🧠 SmartCode AI</div>
    <nav class="space-y-3 mt-8">
      <a class="block hover:text-white transition" routerLink="/dashboard">🏠 Dashboard</a>
      <a class="block hover:text-white transition" routerLink="/history">🕒 History</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    <!-- Top Navbar -->
    <div class="flex justify-end items-center p-4 border-b border-[#3a3a3a] bg-[#252526] shadow-sm">
      <div class="relative">
        <button class="flex items-center gap-2 focus:outline-none group">
          <img src="/assets/user-avatar.png" alt="User Avatar" class="w-8 h-8 rounded-full border border-gray-500" />
          <span class="text-sm text-gray-300">Username</span>
        </button>
        <div class="absolute right-0 mt-2 w-48 bg-[#1e1e1e] border border-[#3a3a3a] rounded-lg shadow-lg py-2 z-10 transition-all">
          <a href="#" class="block px-4 py-2 text-sm hover:bg-[#2d2d2d] rounded">⚙️ Settings</a>
          <a href="#" class="block px-4 py-2 text-sm hover:bg-[#2d2d2d] rounded">🧩 Get Extension</a>
          <a href="#" class="block px-4 py-2 text-sm hover:bg-[#2d2d2d] rounded">🔓 Logout</a>
        </div>
      </div>
    </div>

    <!-- Content Section -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 p-6 flex-1 overflow-auto">
      <!-- Input Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-6 bg-[#252526] rounded-2xl p-6 shadow-lg border border-[#3a3a3a]">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Documentation File</label>
          <input type="file" id="documentationFile" (change)="onFileSelected($event)" required
            class="block w-full bg-[#2a2d30] text-sm text-gray-200 border border-[#3a3a3a] rounded-md p-2 focus:outline-none focus:ring focus:ring-blue-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">API Key</label>
            <input type="text" id="apiKey" [(ngModel)]="apiKey" name="apiKey" required
              class="block w-full bg-[#2a2d30] text-sm text-gray-200 border border-[#3a3a3a] rounded-md p-2 focus:outline-none focus:ring-1 focus:ring-blue-500" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">API Key Type</label>
            <select id="apiKeyType" [(ngModel)]="apiKeyType" name="apiKeyType"
              class="block w-full bg-[#2a2d30] text-sm text-gray-200 border border-[#3a3a3a] rounded-md p-2">
              <option value="OpenAI">OpenAI</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Detail Level</label>
            <select id="detailLevel" [(ngModel)]="detailLevel" name="detailLevel"
              class="block w-full bg-[#2a2d30] text-sm text-gray-200 border border-[#3a3a3a] rounded-md p-2">
              <option value="Basic">Basic</option>
              <option value="Detailed">Detailed</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Feature Type</label>
            <select id="featureType" [(ngModel)]="featureType" name="featureType"
              class="block w-full bg-[#2a2d30] text-sm text-gray-200 border border-[#3a3a3a] rounded-md p-2">
              <option value="Comments">Comments</option>
              <option value="Rename">Rename</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Code Snippet</label>
          <textarea id="codeSnippet" [(ngModel)]="codeSnippet" name="codeSnippet" rows="10" required
            class="block w-full bg-[#1e1e1e] text-green-400 font-mono text-sm border border-[#3a3a3a] rounded-md p-3 leading-relaxed resize-none shadow-inner"
            placeholder="// Paste your code here..."></textarea>
        </div>

        <button type="submit" [disabled]="loading"
          class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 hover:shadow-md transition-all disabled:opacity-50">
          Submit
        </button>

        <div *ngIf="loading" class="text-center text-blue-400 font-medium">⏳ Processing...</div>
        <div *ngIf="error" class="text-center text-red-400 font-medium">{{ error }}</div>
      </form>

      <!-- Output Section -->
      <div class="flex flex-col space-y-4">
        <div class="bg-[#252526] border border-[#3a3a3a] p-4 rounded-2xl shadow-md">
          <h3 class="text-sm font-bold text-blue-400 mb-3">🧾 Modified Code:</h3>
          <pre class="whitespace-pre-wrap text-sm text-green-300 bg-[#1e1e1e] p-4 rounded-md overflow-auto leading-relaxed shadow-inner fade-in">
            {{ result }}
          </pre>

          <h3 class="text-sm font-bold text-blue-400 mb-3 mt-6">Explanation</h3>
          <pre class="whitespace-pre-wrap text-sm text-green-300 bg-[#1e1e1e] p-4 rounded-md overflow-auto leading-relaxed shadow-inner fade-in">
            {{ result }}
          </pre>
        </div>
      </div>
    </div>
  </main>
</div>

<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in {
    animation: fadeIn 0.4s ease-out;
  }
</style>
